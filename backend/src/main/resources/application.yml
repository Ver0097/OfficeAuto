server:
  port: 8080

spring:
  application:
    name: oa-backend

  # 数据源配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://47.93.140.34:3306/oa_system?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 
  # Redis 配置
  data:
    redis:
      host: 47.93.140.34
      port: 6379
      password: 
      database: 0
      timeout: 10000ms

# MyBatis 配置
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.oa.system.user.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# JWT 配置
jwt:
  secret: oa-system-secret-key-2024-must-be-at-least-256-bits
  expiration: 86400000  # 24小时（毫秒）
  header: Authorization
  prefix: "Bearer "

# 验证码配置
captcha:
  expiration: 300  # 5分钟（秒）